# /etc/nginx/conf.d/new-s3.conf на ВМ нового S3 (docs/new-s3-install.md).
#
# TLS и список разрешённых адресов перед SeaweedFS S3 (127.0.0.1:8333). Роутер пробрасывает сюда внешний порт.
# Host уходит без изменений: после переключения (PIPELINE.md, C2) шлюз на minio2 шлёт запросы ELMA365 с
# Host elma.example.com, и SeaweedFS проверяет подпись SigV4 по нему. Поэтому сервер default_server (server_name
# с этим Host не совпадёт), а X-Forwarded-* не добавляются.
#
# Заменить: S3_VM_LAN_IP (адрес ВМ в локальной сети), MINIO2_PUBLIC_IP (внешний адрес minio2).

upstream new_s3 {
    server 127.0.0.1:8333 max_fails=0;
    keepalive 64;
}

# Строка JSON на запрос; путь без строки запроса: подписанные ссылки в лог не попадают.
# addr — адрес клиента, каким его видит ВМ: должен быть внешний адрес minio2, а не адрес роутера.
log_format new_s3 escape=json '{"time":"$time_iso8601","addr":"$remote_addr","method":"$request_method","key":"$uri",'
                              '"status":$status,"in":$request_length,"out":$bytes_sent,"sec":$request_time}';

server {
    listen S3_VM_LAN_IP:9443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/nginx/tls/new-s3.crt;
    ssl_certificate_key /etc/nginx/tls/new-s3.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:new_s3:10m;
    ssl_session_timeout 1h;

    allow MINIO2_PUBLIC_IP;
    deny all;

    access_log /var/log/nginx/new-s3.log new_s3;
    error_log /var/log/nginx/new-s3-error.log warn;

    client_max_body_size 0;
    large_client_header_buffers 8 64k;   # подписанные ссылки с response-content-disposition длинные
    underscores_in_headers on;           # x-amz-meta-* с подчёркиванием не теряются
    ignore_invalid_headers off;
    gzip off;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;    # подпись SigV4 проверяется по Host
    proxy_set_header Connection "";
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_max_temp_file_size 0;
    proxy_connect_timeout 10s;
    proxy_send_timeout 3600s;
    proxy_read_timeout 3600s;
    proxy_next_upstream off;
    proxy_redirect off;

    location / {
        proxy_pass http://new_s3;
    }
}
