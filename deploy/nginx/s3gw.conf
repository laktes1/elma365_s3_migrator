# /etc/nginx/conf.d/s3gw.conf на minio2: шлюз журнала намерений перед MinIO (задача 07, docs/nginx-routing.md).
#
# После включения (PIPELINE.md, A4) MinIO слушает только 127.0.0.1:9000, а 10.10.0.12:9000 принимает nginx:
#   - изменения бакета s3elma365 (всё, кроме GET/HEAD/OPTIONS) идут в шлюз 127.0.0.1:9100;
#   - чтения s3elma365 и все запросы к остальным бакетам идут прямо в MinIO.
# haproxy в Kubernetes и клиенты других бакетов ничего не замечают: адрес тот же.
#
# Запасного пути мимо шлюза нет: если шлюз недоступен, запись в s3elma365 получает 502,
# а не уходит в MinIO без журнала. Откат без перезапуска MinIO: default s3gw_minio в map ниже.
#
# Переключение на новое S3 (PIPELINE.md, C2): чтения s3elma365 тоже идут в шлюз (GET/HEAD/OPTIONS
# ниже -> s3gw_gateway), а шлюз ходит в новое S3. После этого откат map на s3gw_minio запрещён:
# запись ушла бы в MinIO, а чтения остались бы в новом S3. Откат только по PIPELINE.md, C4.

upstream s3gw_minio {
    server 127.0.0.1:9000 max_fails=0;
    keepalive 64;
}

upstream s3gw_gateway {
    server 127.0.0.1:9100 max_fails=0;
    keepalive 64;
}

# В лог попадают только ответы 5xx: 502 (шлюз недоступен), 503 (журнал недоступен), сбои MinIO.
map $status $s3gw_log_5xx {
    ~^5     1;
    default 0;
}

map $request_method $s3gw_elma_backend {
    GET     s3gw_minio;          # C2: s3gw_gateway
    HEAD    s3gw_minio;          # C2: s3gw_gateway
    OPTIONS s3gw_minio;          # C2: s3gw_gateway; CORS-предзапрос перед подписанным PUT ничего не меняет
    default s3gw_gateway;        # ОТКАТ (только до C2): заменить на s3gw_minio и nginx -s reload
}

server {
    listen 127.0.0.1:9080;       # проверка до включения (PIPELINE.md, A3); остаётся для диагностики
    # listen 10.10.0.12:9000;  # включается в PIPELINE.md, A4, когда MinIO уйдёт на 127.0.0.1
    server_name _;

    # Лог на каждый запрос не нужен: в прошлую миграцию волна повторов ELMA365 дала 35 ГБ лога.
    access_log /var/log/nginx/s3gw-5xx.log combined if=$s3gw_log_5xx;
    error_log /var/log/nginx/s3gw-error.log warn;

    client_max_body_size 0;
    large_client_header_buffers 8 64k;   # подписанные ссылки с response-content-disposition длинные
    underscores_in_headers on;           # x-amz-meta-* с подчёркиванием не теряются
    ignore_invalid_headers off;
    gzip off;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;    # подпись SigV4 проверяется по Host, он должен дойти неизменным
    proxy_set_header Connection "";
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_max_temp_file_size 0;
    proxy_connect_timeout 10s;
    proxy_send_timeout 3600s;
    proxy_read_timeout 3600s;
    proxy_next_upstream off;             # без повторов: PUT/DELETE не дублируются
    proxy_redirect off;

    # proxy_pass без URI-части: путь и строка запроса уходят в том виде, в каком пришли.
    location ~ ^/s3elma365(/|$) {
        proxy_pass http://$s3gw_elma_backend;
    }

    location / {
        proxy_pass http://s3gw_minio;
    }
}
