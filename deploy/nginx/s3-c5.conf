# /etc/nginx/conf.d/s3-c5.conf на новом сервере, когда на него перенесён адрес 10.10.0.12 (PIPELINE.md, C5).
#
# Все запросы идут в новое S3. GET и HEAD объекта s3elma365, которого в новом S3 нет (404), nginx повторяет
# в старом MinIO и пишет каждое такое обращение в /var/log/nginx/s3-c5-old-minio.log: время, метод, ключ,
# ответы нового S3 и старого MinIO. Запись, удаление, листинг и другие бакеты в старый MinIO не идут никогда.
# Подпись SigV4 проверяется по Host и сырому пути, они уходят неизменными, а ключи ELMA365 в обоих хранилищах одни.
#
# Держать недолго: после чистой сверки (C1) в новом S3 есть всё, и строка в логе означает либо файл,
# удалённый в ELMA365 после выключения обратного обработчика (прокси отдаёт его снова), либо пропуск.
# Проверено стендом scripts/stand_c5.py.
#
# Заменить: NEW_S3_HOST:PORT (новое S3), OLD_MINIO_HOST (старый MinIO на своём новом адресе).

upstream s3c5_new {
    server NEW_S3_HOST:PORT max_fails=0;
    keepalive 64;
}

upstream s3c5_old_minio {
    server OLD_MINIO_HOST:9000 max_fails=0;
    keepalive 16;
}

# Строка JSON на запрос (jq -r .key s3-c5-old-minio.log); путь без строки запроса: подписанные ссылки в лог не попадают.
# upstream: ответы нового S3 и старого MinIO ("404 : 200"), status: что получил клиент
log_format s3c5 escape=json '{"time":"$time_iso8601","method":"$request_method","key":"$uri","upstream":"$upstream_status","status":$status}';

map $status $s3c5_log_5xx {
    ~^5     1;
    default 0;
}

map $request_method $s3c5_read {
    GET     1;
    HEAD    1;
    default 0;
}

server {
    listen 10.10.0.12:9000;
    server_name _;

    access_log /var/log/nginx/s3-c5-5xx.log s3c5 if=$s3c5_log_5xx;
    error_log /var/log/nginx/s3-c5-error.log warn;

    client_max_body_size 0;
    large_client_header_buffers 8 64k;   # подписанные ссылки с response-content-disposition длинные
    underscores_in_headers on;           # x-amz-meta-* с подчёркиванием не теряются
    ignore_invalid_headers off;
    gzip off;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;    # подпись SigV4 проверяется по Host
    proxy_set_header Connection "";
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_max_temp_file_size 0;
    proxy_connect_timeout 10s;
    proxy_send_timeout 3600s;
    proxy_read_timeout 3600s;
    proxy_next_upstream off;
    proxy_redirect off;

    # Объект s3elma365: чтение уходит в @s3c5_read, изменения прямо в новое S3. 418 здесь только
    # внутренний переход: внутри if в location безопасен лишь return.
    location ~ ^/s3elma365/. {
        recursive_error_pages on;        # иначе после error_page 418 nginx не выполнит error_page 404 в @s3c5_read
        error_page 418 = @s3c5_read;
        if ($s3c5_read) {
            return 418;
        }
        proxy_pass http://s3c5_new;
    }

    # Чтение объекта: ответ 404 нового S3 перехватывается и запрос в том же виде уходит в старый MinIO
    location @s3c5_read {
        proxy_intercept_errors on;
        error_page 404 = @s3c5_old_minio;
        proxy_pass http://s3c5_new;
    }

    location @s3c5_old_minio {
        access_log /var/log/nginx/s3-c5-old-minio.log s3c5;
        proxy_pass http://s3c5_old_minio;
    }

    location / {
        proxy_pass http://s3c5_new;
    }
}
